<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Ka Sastagram</title>
<style>
  :root { --bg:#fff; --soft:#fafafa; --line:#dbdbdb; --text:#262626; --muted:#737373; --accent:#e1306c; --blue:#0095f6; --ok:#1a7f37; --err:#c62828; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--soft); color:var(--text); }
  .app { max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:64px; border-left:1px solid var(--line); border-right:1px solid var(--line); }
  .brand { font-family:"Brush Script MT","Segoe Script",cursive; font-size:1.7rem; color:var(--text); }
  svg { width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  input, textarea, button { font:inherit; }
  input, textarea { width:100%; padding:12px; margin-top:8px; border:1px solid var(--line); border-radius:8px; background:var(--soft); color:var(--text); }
  textarea { resize:vertical; min-height:80px; }
  .btn { width:100%; margin-top:10px; padding:12px; border:0; border-radius:8px; background:var(--blue); color:#fff; font-weight:600; cursor:pointer; }
  .btn:disabled { opacity:.6; }
  .link { background:none; border:0; color:var(--blue); font-weight:600; cursor:pointer; padding:4px; }
  .icon-btn { background:none; border:0; color:var(--text); padding:6px; cursor:pointer; display:flex; }
  .hidden { display:none !important; }
  .center { text-align:center; }

  #msg { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:50; max-width:440px; width:calc(100% - 24px); padding:10px 12px; border-radius:10px; font-size:.9rem; display:none; box-shadow:0 4px 14px rgba(0,0,0,.15); }
  #msg.ok { display:block; background:#e6f4ea; color:var(--ok); }
  #msg.err { display:block; background:#fdecea; color:var(--err); }

  /* auth */
  .authwrap { padding:28px 24px; }
  .authwrap .brand { font-size:2.6rem; text-align:center; margin:20px 0 6px; color:var(--accent); }
  .authwrap .tag { text-align:center; color:var(--muted); margin-bottom:20px; }
  .box { border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:12px; }
  label.small { display:block; margin-top:10px; font-size:.8rem; color:var(--muted); }
  label.chk { display:flex; gap:8px; align-items:flex-start; margin-top:12px; font-size:.85rem; color:var(--muted); }
  label.chk input { width:auto; margin:3px 0 0; }

  /* header */
  .header { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:6px 12px; }
  .header .right { display:flex; gap:4px; }

  /* stories */
  .stories { display:flex; gap:14px; overflow-x:auto; padding:12px; border-bottom:1px solid var(--line); scrollbar-width:none; }
  .stories::-webkit-scrollbar { display:none; }
  .story { flex:0 0 auto; width:66px; text-align:center; cursor:pointer; }
  .ring { width:62px; height:62px; border-radius:50%; padding:3px; background:linear-gradient(45deg,#f9a03f,#e1306c,#833ab4); margin:0 auto; }
  .ring.mine { background:var(--line); }
  .ring .in { width:100%; height:100%; border-radius:50%; background:#fff; padding:2px; }
  .avatar { width:100%; height:100%; border-radius:50%; background:#efefef; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--muted); text-transform:uppercase; position:relative; }
  .plus { position:absolute; right:-2px; bottom:-2px; width:20px; height:20px; border-radius:50%; background:var(--blue); color:#fff; border:2px solid #fff; font-size:14px; line-height:16px; text-align:center; }
  .story .name { font-size:.72rem; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* posts */
  .post { border-bottom:1px solid var(--line); padding-bottom:6px; }
  .phead { display:flex; align-items:center; gap:10px; padding:10px 12px; }
  .phead .sm { width:34px; height:34px; flex:0 0 34px; border-radius:50%; background:linear-gradient(45deg,#f9a03f,#e1306c,#833ab4); padding:2px; }
  .phead .sm .avatar { background:#fff; font-size:.85rem; border:2px solid #fff; }
  .phead .who { font-weight:700; font-size:.9rem; }
  .phead .time { color:var(--muted); font-size:.72rem; }
  .post img.pic { width:100%; display:block; background:#efefef; max-height:520px; object-fit:cover; }
  .actions { display:flex; gap:6px; padding:6px 8px 0; }
  .ptext { padding:4px 14px 8px; font-size:.92rem; white-space:pre-wrap; word-wrap:break-word; }
  .ptext b { margin-right:6px; }
  .empty { padding:40px 20px; text-align:center; color:var(--muted); }

  /* profile */
  .pro { padding:20px 16px; }
  .pro .top { display:flex; align-items:center; gap:20px; }
  .pro .big { width:84px; height:84px; border-radius:50%; padding:3px; background:linear-gradient(45deg,#f9a03f,#e1306c,#833ab4); }
  .pro .big .avatar { background:#fff; border:3px solid #fff; font-size:2rem; }
  .pro .stat { text-align:center; }
  .pro .stat b { display:block; font-size:1.1rem; }
  .pro .stat span { font-size:.8rem; color:var(--muted); }
  .pro .stats { display:flex; gap:24px; flex:1; justify-content:center; }
  .out { background:#efefef; color:var(--text); }

  /* bottom nav */
  .nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--bg); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:8px 0; z-index:10; }
  .nav .icon-btn.active svg { stroke-width:2.6; }

  /* composer sheet */
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30; display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:#fff; width:100%; max-width:480px; border-radius:16px 16px 0 0; padding:16px; }
  .sheet h3 { margin:0 0 4px; }
</style>
</head>
<body>
<div id="msg"></div>

<div class="app">

  <!-- AUTH -->
  <div id="authView" class="authwrap">
    <div class="brand">School Ka Sastagram</div>
    <div class="tag">Connect with your school friends</div>

    <div class="box" id="loginCard">
      <form id="loginForm">
        <input id="loginEmail" type="email" placeholder="Email" autocomplete="email" required>
        <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required>
        <button class="btn" type="submit" id="loginBtn">Log in</button>
      </form>
    </div>
    <div class="box center" id="loginSwitch">No account? <button class="link" id="showSignup">Sign up</button></div>

    <div class="box hidden" id="signupCard">
      <form id="signupForm">
        <input id="signupUsername" type="text" placeholder="Username (3-20 letters, numbers, _)" autocomplete="username" required>
        <input id="signupEmail" type="email" placeholder="Email" autocomplete="email" required>
        <input id="signupPassword" type="password" placeholder="Password (min 8 characters)" autocomplete="new-password" required>
        <label class="small" for="signupDob">Date of birth</label>
        <input id="signupDob" type="date" required>
        <label class="chk"><input id="signupAge" type="checkbox"> I confirm I am 13 years or older.</label>
        <button class="btn" type="submit" id="signupBtn">Sign up</button>
      </form>
    </div>
    <div class="box center hidden" id="signupSwitch">Have an account? <button class="link" id="showLogin">Log in</button></div>
  </div>

  <!-- MAIN APP -->
  <div id="appView" class="hidden">
    <div class="header">
      <div class="brand">School Ka Sastagram</div>
      <div class="right">
        <button class="icon-btn" data-soon="Notifications"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>
        <button class="icon-btn" data-soon="Private chat"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
      </div>
    </div>

    <!-- HOME TAB -->
    <div id="tabHome">
      <div class="stories" id="stories"></div>
      <div id="feed"></div>
    </div>

    <!-- SEARCH TAB -->
    <div id="tabSearch" class="hidden empty">Search and finding friends is coming in the next step.</div>

    <!-- PROFILE TAB -->
    <div id="tabProfile" class="hidden pro">
      <div class="top">
        <div class="big"><div class="avatar" id="proAvatar"></div></div>
        <div class="stats">
          <div class="stat"><b id="proPosts">0</b><span>posts</span></div>
          <div class="stat"><b>0</b><span>followers</span></div>
          <div class="stat"><b>0</b><span>following</span></div>
        </div>
      </div>
      <p style="margin:14px 0 0"><b id="proName"></b></p>
      <button class="btn out" id="logoutBtn">Log out</button>
    </div>

    <!-- BOTTOM NAV -->
    <div class="nav">
      <button class="icon-btn active" id="navHome"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></button>
      <button class="icon-btn" id="navSearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
      <button class="icon-btn" id="navAdd"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg></button>
      <button class="icon-btn" data-soon="Private chat"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.8A8 8 0 1 1 21 12z"/></svg></button>
      <button class="icon-btn" id="navProfile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
    </div>
  </div>
</div>

<!-- COMPOSER -->
<div class="sheet-bg hidden" id="composer">
  <div class="sheet">
    <h3>New post</h3>
    <form id="postForm">
      <textarea id="postText" placeholder="Write a caption..." maxlength="500"></textarea>
      <input id="postImage" type="url" placeholder="Image link (optional, https://...)">
      <button class="btn" type="submit" id="postBtn">Share</button>
      <button class="btn out" type="button" id="postCancel">Cancel</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://rxnzqrycdftmozwcvqyr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_kPCGUiIR_joBHFcrO3gTQg_M1k-5AG8";

const $ = (id) => document.getElementById(id);
const msgBox = $("msg");
let msgTimer;
function showMsg(text, type) {
  msgBox.textContent = text; msgBox.className = type;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { msgBox.className = ""; }, type === "ok" ? 4000 : 9000);
}
function clearMsg() { msgBox.className = ""; }

const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
if (!sb) showMsg("Could not load Supabase library. Check internet and refresh.", "err");

function friendlyError(err) {
  const m = (err && err.message) || String(err);
  if (/Invalid login credentials/i.test(m)) return "Wrong email or password.";
  if (/Email not confirmed/i.test(m)) return "Please confirm your email first. Check inbox and spam.";
  if (/already registered/i.test(m)) return "This email already has an account. Try logging in.";
  if (/rate limit/i.test(m)) return "Too many attempts. Please wait a few minutes.";
  if (/duplicate key|unique/i.test(m)) return "That username is already taken.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Network problem. Check internet and try again.";
  return m;
}
function ageFromDob(s) {
  const d = new Date(s + "T00:00:00"); if (isNaN(d)) return -1;
  const n = new Date(); let a = n.getFullYear() - d.getFullYear();
  const md = n.getMonth() - d.getMonth();
  if (md < 0 || (md === 0 && n.getDate() < d.getDate())) a--;
  return a;
}

// coming-soon buttons
document.querySelectorAll("[data-soon]").forEach(b => b.onclick = () => showMsg(b.dataset.soon + " is coming in a next step!", "ok"));

// auth switch
$("showSignup").onclick = () => { clearMsg(); ["loginCard","loginSwitch"].forEach(i => $(i).classList.add("hidden")); ["signupCard","signupSwitch"].forEach(i => $(i).classList.remove("hidden")); };
$("showLogin").onclick = () => { clearMsg(); ["signupCard","signupSwitch"].forEach(i => $(i).classList.add("hidden")); ["loginCard","loginSwitch"].forEach(i => $(i).classList.remove("hidden")); };

// SIGNUP
$("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault(); clearMsg();
  const username = $("signupUsername").value.trim().toLowerCase();
  const email = $("signupEmail").value.trim();
  const password = $("signupPassword").value;
  const dob = $("signupDob").value;
  if (!/^[a-z0-9_]{3,20}$/.test(username)) return showMsg("Username must be 3-20 characters: letters, numbers or underscore.", "err");
  if (password.length < 8) return showMsg("Password must be at least 8 characters.", "err");
  if (!dob) return showMsg("Please enter your date of birth.", "err");
  const age = ageFromDob(dob);
  if (age < 0) return showMsg("Invalid date of birth.", "err");
  if (age < 13) return showMsg("Sorry, you must be at least 13 years old to join.", "err");
  if (!$("signupAge").checked) return showMsg("Please confirm you are 13 or older.", "err");
  const btn = $("signupBtn"); btn.disabled = true; btn.textContent = "Creating account...";
  try {
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username, birth_date: dob }, emailRedirectTo: window.location.origin } });
    if (error) throw error;
    if (data.user && data.user.identities && data.user.identities.length === 0) throw new Error("already registered");
    $("signupForm").reset();
    if (!data.session) {
      $("showLogin").click();
      showMsg("Account created! Confirmation link sent to " + email + ". Open it, then log in.", "ok");
    }
  } catch (err) { console.error(err); showMsg("Signup failed: " + friendlyError(err), "err"); }
  finally { btn.disabled = false; btn.textContent = "Sign up"; }
});

// LOGIN
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault(); clearMsg();
  const btn = $("loginBtn"); btn.disabled = true; btn.textContent = "Logging in...";
  try {
    const { error } = await sb.auth.signInWithPassword({ email: $("loginEmail").value.trim(), password: $("loginPassword").value });
    if (error) throw error;
    $("loginForm").reset();
  } catch (err) { console.error(err); showMsg("Login failed: " + friendlyError(err), "err"); }
  finally { btn.disabled = false; btn.textContent = "Log in"; }
});

$("logoutBtn").onclick = async () => { await sb.auth.signOut(); showMsg("You have been logged out.", "ok"); };

// PROFILE
let me = null;
async function ensureProfile(user) {
  const { data: ex, error: e1 } = await sb.from("profiles").select("id, username").eq("id", user.id).maybeSingle();
  if (e1) throw e1;
  if (ex) return ex;
  const username = ((user.user_metadata && user.user_metadata.username) || "user" + user.id.slice(0, 6)).toLowerCase();
  const { data, error } = await sb.from("profiles").insert({ id: user.id, username }).select("id, username").single();
  if (error) throw error;
  return data;
}

// TABS
function setTab(name) {
  $("tabHome").classList.toggle("hidden", name !== "home");
  $("tabSearch").classList.toggle("hidden", name !== "search");
  $("tabProfile").classList.toggle("hidden", name !== "profile");
  $("navHome").classList.toggle("active", name === "home");
  $("navSearch").classList.toggle("active", name === "search");
  $("navProfile").classList.toggle("active", name === "profile");
  window.scrollTo(0, 0);
}
$("navHome").onclick = () => { setTab("home"); loadFeed(); };
$("navSearch").onclick = () => setTab("search");
$("navProfile").onclick = () => setTab("profile");
$("navAdd").onclick = () => $("composer").classList.remove("hidden");
$("postCancel").onclick = () => $("composer").classList.add("hidden");

// icons
const ICON_HEART = '<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>';
const ICON_COMMENT = '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.8A8 8 0 1 1 21 12z"/></svg>';
const ICON_SEND = '<svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>';

function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " hr ago";
  return new Date(iso).toLocaleDateString();
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

async function loadStories() {
  const box = $("stories"); box.innerHTML = "";
  const mine = el("div", "story");
  const r = el("div", "ring mine"); const inn = el("div", "in"); const av = el("div", "avatar", (me.username || "?")[0]);
  av.appendChild(el("span", "plus", "+")); inn.appendChild(av); r.appendChild(inn);
  mine.append(r, el("div", "name", "Your story"));
  mine.onclick = () => showMsg("Stories are coming in a next step!", "ok");
  box.appendChild(mine);
  const { data } = await sb.from("profiles").select("id, username").neq("id", me.id).limit(15);
  (data || []).forEach(p => {
    const s = el("div", "story");
    const ring = el("div", "ring"); const i2 = el("div", "in"); i2.appendChild(el("div", "avatar", p.username[0]));
    ring.appendChild(i2); s.append(ring, el("div", "name", p.username));
    s.onclick = () => showMsg("Stories are coming in a next step!", "ok");
    box.appendChild(s);
  });
}

async function loadFeed() {
  const feed = $("feed");
  const { data: posts, error } = await sb.from("posts").select("*").order("created_at", { ascending: false }).limit(50);
  if (error) { console.error(error); feed.innerHTML = ""; return showMsg("Could not load posts: " + error.message, "err"); }
  feed.innerHTML = "";
  $("proPosts").textContent = posts.filter(p => p.user_id === me.id).length;
  if (!posts.length) { feed.appendChild(el("div", "empty", "No posts yet. Tap the + button below to share the first one!")); return; }
  const ids = [...new Set(posts.map(p => p.user_id))];
  const names = {};
  const { data: profs } = await sb.from("profiles").select("id, username").in("id", ids);
  (profs || []).forEach(p => names[p.id] = p.username);

  posts.forEach(p => {
    const name = names[p.user_id] || "unknown";
    const card = el("div", "post");
    const head = el("div", "phead");
    const sm = el("div", "sm"); sm.appendChild(el("div", "avatar", name[0]));
    const meta = el("div"); meta.append(el("div", "who", name), el("div", "time", timeAgo(p.created_at)));
    head.append(sm, meta); card.appendChild(head);
    if (p.image_url && /^https:\/\//i.test(p.image_url)) {
      const img = el("img", "pic"); img.src = p.image_url; img.alt = "Post"; img.loading = "lazy";
      img.onerror = () => img.remove(); card.appendChild(img);
    }
    const act = el("div", "actions");
    [[ICON_HEART, "Likes"], [ICON_COMMENT, "Comments"], [ICON_SEND, "Sharing"]].forEach(([svg, label]) => {
      const b = el("button", "icon-btn"); b.innerHTML = svg; b.onclick = () => showMsg(label + " are coming in a next step!", "ok"); act.appendChild(b);
    });
    card.appendChild(act);
    if (p.content) { const t = el("div", "ptext"); t.append(el("b", null, name), document.createTextNode(p.content)); card.appendChild(t); }
    feed.appendChild(card);
  });
}

// POST
$("postForm").addEventListener("submit", async (e) => {
  e.preventDefault(); clearMsg();
  const content = $("postText").value.trim(); const image = $("postImage").value.trim();
  if (!content && !image) return showMsg("Write something or add an image link.", "err");
  if (image && !/^https:\/\//i.test(image)) return showMsg("Image link must start with https://", "err");
  const btn = $("postBtn"); btn.disabled = true; btn.textContent = "Sharing...";
  try {
    const { error } = await sb.from("posts").insert({ user_id: me.id, content, image_url: image || null });
    if (error) throw error;
    $("postForm").reset(); $("composer").classList.add("hidden");
    showMsg("Posted!", "ok"); setTab("home"); await loadFeed();
  } catch (err) { console.error(err); showMsg("Could not post: " + friendlyError(err), "err"); }
  finally { btn.disabled = false; btn.textContent = "Share"; }
});

// SESSION
async function onSession(session) {
  if (!session) { me = null; $("authView").classList.remove("hidden"); $("appView").classList.add("hidden"); return; }
  try {
    me = await ensureProfile(session.user);
    $("proName").textContent = me.username; $("proAvatar").textContent = me.username[0];
    $("authView").classList.add("hidden"); $("appView").classList.remove("hidden");
    setTab("home"); await loadStories(); await loadFeed();
  } catch (err) {
    console.error(err);
    showMsg("Logged in, but profile problem: " + friendlyError(err), "err");
  }
}
if (sb) sb.auth.onAuthStateChange((ev, session) => setTimeout(() => onSession(session), 0));
</script>
</body>
</html>
