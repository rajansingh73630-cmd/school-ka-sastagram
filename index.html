<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Ka Sastagram</title>
<style>
  :root { --bg:#fff; --soft:#f7f7f8; --line:#e3e3e6; --text:#1c1c1e; --muted:#76767c; --accent:#7c3aed; --accent2:#ec4899; --blue:#4f46e5; --red:#ed4956; --ok:#1a7f37; --err:#c62828; --grad:linear-gradient(45deg,#f59e0b,#ec4899,#7c3aed); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--soft); color:var(--text); }
  svg { width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }
  input, textarea, button { font:inherit; }
  input, textarea { width:100%; padding:12px; margin-top:8px; border:1px solid var(--line); border-radius:10px; background:var(--soft); color:var(--text); }
  textarea { resize:vertical; min-height:72px; }
  .btn { width:100%; margin-top:10px; padding:12px; border:0; border-radius:10px; background:var(--blue); color:#fff; font-weight:600; cursor:pointer; }
  .btn:disabled { opacity:.6; }
  .btn.out { background:#efeff1; color:var(--text); }
  .btn.sm { width:auto; margin:0; padding:7px 16px; font-size:.85rem; }
  .btn.danger { background:#fdecea; color:var(--err); }
  .link { background:none; border:0; color:var(--blue); font-weight:600; cursor:pointer; padding:4px; }
  .icon-btn { background:none; border:0; color:var(--text); padding:6px; cursor:pointer; display:flex; position:relative; }
  .hidden { display:none !important; }
  .center { text-align:center; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:800; font-size:1.1rem; letter-spacing:-.3px; }
  .mark { width:30px; height:30px; border-radius:9px; background:var(--grad); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; }

  #msg { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:90; max-width:440px; width:calc(100% - 24px); padding:10px 12px; border-radius:10px; font-size:.9rem; display:none; box-shadow:0 4px 14px rgba(0,0,0,.15); }
  #msg.ok { display:block; background:#e6f4ea; color:var(--ok); }
  #msg.err { display:block; background:#fdecea; color:var(--err); }

  /* auth */
  .authwrap { max-width:420px; margin:0 auto; padding:28px 24px; background:var(--bg); min-height:100vh; }
  .authwrap .brand { justify-content:center; font-size:1.6rem; margin:24px 0 6px; }
  .authwrap .tag { text-align:center; color:var(--muted); margin-bottom:20px; }
  .box { border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  label.small { display:block; margin-top:10px; font-size:.8rem; color:var(--muted); }
  label.chk { display:flex; gap:8px; align-items:flex-start; margin-top:12px; font-size:.85rem; color:var(--muted); }
  label.chk input { width:auto; margin:3px 0 0; }

  /* shell */
  .shell { display:flex; min-height:100vh; max-width:1000px; margin:0 auto; background:var(--bg); border-left:1px solid var(--line); border-right:1px solid var(--line); }
  .side { display:none; width:230px; border-right:1px solid var(--line); padding:20px 12px; position:sticky; top:0; height:100vh; flex-direction:column; gap:4px; }
  .side .brand { padding:0 10px 18px; }
  .sbtn { display:flex; align-items:center; gap:14px; padding:12px; border:0; background:none; border-radius:10px; font-size:1rem; cursor:pointer; position:relative; color:var(--text); text-align:left; width:100%; }
  .sbtn:hover { background:var(--soft); }
  .sbtn.active { font-weight:700; }
  .sbtn.active svg, .icon-btn.active svg { stroke-width:2.8; }
  .main { flex:1; min-width:0; padding-bottom:70px; }
  .topbar { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:8px 12px; }
  .bottom { position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:space-around; background:var(--bg); border-top:1px solid var(--line); padding:8px 0; z-index:10; }
  .badge { position:absolute; top:0; right:0; background:var(--red); color:#fff; font-size:.65rem; font-weight:700; border-radius:10px; padding:1px 6px; min-width:18px; text-align:center; }
  .sbtn .badge { top:6px; left:30px; right:auto; }
  @media (min-width:768px) {
    .side { display:flex; }
    .bottom, .topbar { display:none; }
    .main { padding-bottom:20px; max-width:640px; margin:0 auto; }
  }

  .avw { border-radius:50%; }
  .avatar { width:100%; height:100%; border-radius:50%; background:#ececf0; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--muted); text-transform:uppercase; overflow:hidden; }
  .avatar img { width:100%; height:100%; object-fit:cover; }

  .stories { display:flex; gap:14px; overflow-x:auto; padding:12px; border-bottom:1px solid var(--line); scrollbar-width:none; }
  .stories::-webkit-scrollbar { display:none; }
  .story { flex:0 0 auto; width:68px; text-align:center; cursor:pointer; }
  .story .name { font-size:.72rem; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .story .wrap { position:relative; width:62px; margin:0 auto; }
  .plus { position:absolute; right:-2px; bottom:-2px; width:20px; height:20px; border-radius:50%; background:var(--blue); color:#fff; border:2px solid #fff; font-size:14px; line-height:16px; text-align:center; }

  .post { border-bottom:1px solid var(--line); padding-bottom:8px; }
  .phead { display:flex; align-items:center; gap:10px; padding:10px 12px; }
  .phead .who { font-weight:600; font-size:.9rem; cursor:pointer; }
  .phead .time { color:var(--muted); font-size:.72rem; }
  .phead .grow { flex:1; min-width:0; }
  .media { width:100%; display:block; background:#000; max-height:560px; object-fit:contain; }
  img.media { background:#efefef; object-fit:cover; }
  .actions { display:flex; gap:6px; padding:6px 8px 0; }
  .liked svg { fill:var(--red); stroke:var(--red); }
  .ptext, .likes, .vc { padding:2px 14px; font-size:.9rem; word-wrap:break-word; }
  .likes { font-weight:600; }
  .ptext { white-space:pre-wrap; }
  .ptext b { margin-right:6px; font-weight:600; cursor:pointer; }
  .vc { color:var(--muted); cursor:pointer; background:none; border:0; text-align:left; width:100%; }
  .empty { padding:40px 20px; text-align:center; color:var(--muted); }

  .row { display:flex; align-items:center; gap:12px; padding:10px 14px; }
  .row .grow { flex:1; min-width:0; }
  .row .t1 { font-weight:600; font-size:.92rem; cursor:pointer; }
  .row .t2 { color:var(--muted); font-size:.82rem; overflow:hidden; text-overflow:ellipsis; }
  .row.unread { background:#f5f3ff; }
  .acts { display:flex; gap:6px; }
  .searchbox { padding:12px 14px; border-bottom:1px solid var(--line); }
  .searchbox input { margin:0; }
  .head2 { padding:12px 14px; font-weight:700; font-size:1.1rem; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }

  .pro { padding:18px 16px 8px; }
  .pro .top { display:flex; align-items:center; gap:20px; }
  .pro .stats { display:flex; flex:1; justify-content:space-around; text-align:center; }
  .pro .stat b { display:block; font-size:1.1rem; }
  .pro .stat span { font-size:.8rem; color:var(--muted); }
  .pro .nm { margin-top:12px; font-weight:700; }
  .pro .bio { margin-top:2px; white-space:pre-wrap; font-size:.92rem; }
  .pro .btns { display:flex; gap:8px; margin-top:12px; }
  .pro .btns .btn { margin:0; flex:1; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; margin-top:12px; border-top:1px solid var(--line); padding-top:2px; }
  .tile { aspect-ratio:1; background:#ececf0; position:relative; overflow:hidden; cursor:pointer; }
  .tile img, .tile video { width:100%; height:100%; object-fit:cover; display:block; }
  .tile .tx { padding:8px; font-size:.75rem; color:var(--muted); overflow:hidden; }
  .tile .pl { position:absolute; top:6px; right:6px; color:#fff; width:20px; height:20px; filter:drop-shadow(0 0 2px #000); }
  .private-note { text-align:center; padding:40px 20px; color:var(--muted); border-top:1px solid var(--line); margin-top:12px; }

  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40; display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:#fff; width:100%; max-width:520px; border-radius:16px 16px 0 0; padding:16px; max-height:92vh; overflow-y:auto; }
  @media (min-width:768px) { .sheet-bg { align-items:center; } .sheet { border-radius:16px; } }
  .sheet h3 { margin:0 0 4px; }
  .pick { display:block; margin-top:10px; padding:14px; border:2px dashed var(--line); border-radius:10px; text-align:center; color:var(--blue); font-weight:600; cursor:pointer; }
  #preview { margin-top:10px; }
  #preview img, #preview video { width:100%; max-height:260px; object-fit:contain; border-radius:8px; background:#000; }
  .hint { font-size:.75rem; color:var(--muted); margin-top:6px; }
  .clist { max-height:45vh; overflow-y:auto; margin:8px 0; }
  .c { padding:6px 0; font-size:.9rem; word-wrap:break-word; }
  .c b { font-weight:600; margin-right:6px; }
  .c small { color:var(--muted); margin-left:6px; }
  .crow { display:flex; gap:8px; align-items:center; }
  .crow input { margin:0; }
  .crow button { width:auto; margin:0; padding:10px 16px; }
  .edit-av { display:flex; align-items:center; gap:14px; margin:10px 0; }
</style>
</head>
<body>
<div id="msg"></div>

<!-- AUTH -->
<div id="authView" class="authwrap">
  <div class="brand"><div class="mark">S</div>School Ka Sastagram</div>
  <div class="tag">Connect with your school friends</div>
  <div class="box" id="loginCard">
    <form id="loginForm">
      <input id="loginEmail" type="email" placeholder="Email" autocomplete="email" required>
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="btn" type="submit" id="loginBtn">Log in</button>
    </form>
  </div>
  <div class="box center" id="loginSwitch">No account? <button class="link" id="showSignup">Sign up</button></div>
  <div class="box hidden" id="signupCard">
    <form id="signupForm">
      <input id="signupUsername" type="text" placeholder="Username (3-20 letters, numbers, _)" autocomplete="username" required>
      <input id="signupEmail" type="email" placeholder="Email" autocomplete="email" required>
      <input id="signupPassword" type="password" placeholder="Password (min 8 characters)" autocomplete="new-password" required>
      <label class="small" for="signupDob">Date of birth</label>
      <input id="signupDob" type="date" required>
      <label class="chk"><input id="signupAge" type="checkbox"> I confirm I am 13 years or older.</label>
      <button class="btn" type="submit" id="signupBtn">Sign up</button>
    </form>
  </div>
  <div class="box center hidden" id="signupSwitch">Have an account? <button class="link" id="showLogin">Log in</button></div>
</div>

<!-- APP -->
<div id="appView" class="shell hidden">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="topbar">
      <div class="brand"><div class="mark">S</div>School Ka Sastagram</div>
      <div style="display:flex;gap:4px">
        <button class="icon-btn" id="topBell"></button>
        <button class="icon-btn" id="topChat"></button>
      </div>
    </div>
    <div id="view"></div>
  </main>
  <nav class="bottom" id="bottom"></nav>
</div>

<!-- NEW POST -->
<div class="sheet-bg hidden" id="composer"><div class="sheet">
  <h3>New post</h3>
  <form id="postForm">
    <label class="pick" for="fileInput">+ Choose photo or video</label>
    <input id="fileInput" type="file" accept="image/*,video/*" class="hidden">
    <div id="preview"></div>
    <div class="hint">Photos up to 10 MB. Videos up to 25 MB (mp4/webm).</div>
    <textarea id="postText" placeholder="Write a caption..." maxlength="500"></textarea>
    <button class="btn" type="submit" id="postBtn">Share</button>
    <button class="btn out" type="button" id="postCancel">Cancel</button>
  </form>
</div></div>

<!-- COMMENTS -->
<div class="sheet-bg hidden" id="cSheet"><div class="sheet">
  <h3>Comments</h3>
  <div class="clist" id="cList"></div>
  <form id="cForm" class="crow">
    <input id="cText" type="text" placeholder="Add a comment..." maxlength="300" required>
    <button class="btn" type="submit">Post</button>
  </form>
  <button class="btn out" type="button" id="cClose">Close</button>
</div></div>

<!-- EDIT PROFILE -->
<div class="sheet-bg hidden" id="editSheet"><div class="sheet">
  <h3>Edit profile</h3>
  <div class="edit-av"><div id="editAv"></div>
    <div><label class="link" for="avFile" style="cursor:pointer">Change photo</label>
    <input id="avFile" type="file" accept="image/*" class="hidden"></div>
  </div>
  <label class="small">Name</label>
  <input id="editName" type="text" maxlength="40" placeholder="Your name">
  <label class="small">Bio</label>
  <textarea id="editBio" maxlength="150" placeholder="Write something about you..."></textarea>
  <label class="chk"><input id="editPrivate" type="checkbox"> Private account (only approved followers see your posts). Accounts under 18 must stay private.</label>
  <button class="btn" id="editSave">Save</button>
  <button class="btn out" id="editCancel">Cancel</button>
</div></div>

<!-- POST VIEWER -->
<div class="sheet-bg hidden" id="postModal"><div class="sheet" style="padding:0">
  <div id="postModalBody"></div>
  <div style="padding:12px"><button class="btn out" id="postModalClose" style="margin:0">Close</button></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://rxnzqrycdftmozwcvqyr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_kPCGUiIR_joBHFcrO3gTQg_M1k-5AG8";
const PROFILE_COLS = "id, username, full_name, bio, avatar_url, is_private";

const $ = (id) => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const msgBox = $("msg"); let msgTimer;
function showMsg(text, type) { msgBox.textContent = text; msgBox.className = type; clearTimeout(msgTimer); msgTimer = setTimeout(() => { msgBox.className = ""; }, type === "ok" ? 4000 : 10000); }
function clearMsg() { msgBox.className = ""; }
const soon = (what) => showMsg(what + " is coming in a next step!", "ok");

const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
if (!sb) showMsg("Could not load Supabase library. Check internet and refresh.", "err");

function friendlyError(err) {
  const m = (err && err.message) || String(err);
  if (/Invalid login credentials/i.test(m)) return "Wrong email or password.";
  if (/Email not confirmed/i.test(m)) return "Please confirm your email first. Check inbox and spam.";
  if (/already registered/i.test(m)) return "This email already has an account. Try logging in.";
  if (/rate limit/i.test(m)) return "Too many attempts. Please wait a few minutes.";
  if (/Database error saving new user/i.test(m)) return "Could not create the account. Make sure the username is free and you are 13 or older.";
  if (/duplicate key|unique/i.test(m)) return "That is already taken.";
  if (/under 18/i.test(m)) return "Accounts under 18 must stay private.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Network problem. Check internet and try again.";
  if (/row-level security|policy/i.test(m)) return "Permission denied by database rules. (" + m + ")";
  return m;
}
function ageFromDob(s) { const d = new Date(s + "T00:00:00"); if (isNaN(d)) return -1; const n = new Date(); let a = n.getFullYear() - d.getFullYear(); const md = n.getMonth() - d.getMonth(); if (md < 0 || (md === 0 && n.getDate() < d.getDate())) a--; return a; }
function timeAgo(iso) { const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000); if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + " min ago"; if (s < 86400) return Math.floor(s / 3600) + " hr ago"; return new Date(iso).toLocaleDateString(); }

// ---------- icons ----------
const ICONS = {
  home: '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  reels: '<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M10 8.5v7l6-3.5z"/>',
  chat: '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>',
  heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
  plus: '<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  comment: '<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.8A8 8 0 1 1 21 12z"/>',
  play: '<path d="M7 4v16l13-8z" fill="currentColor"/>'
};
const ico = (n) => '<svg viewBox="0 0 24 24">' + ICONS[n] + '</svg>';

function avatar(p, size, ring) {
  const w = el("div", "avw"); w.style.width = w.style.height = size + "px"; w.style.flex = "0 0 " + size + "px";
  if (ring) { w.style.padding = "2px"; w.style.background = "var(--grad)"; }
  const a = el("div", "avatar"); a.style.fontSize = (size * 0.4) + "px";
  if (ring) a.style.border = "2px solid #fff";
  if (p && p.avatar_url) { const i = el("img"); i.src = p.avatar_url; i.alt = ""; a.appendChild(i); } else a.textContent = ((p && p.username) || "?")[0];
  w.appendChild(a); return w;
}

// ---------- auth ----------
$("showSignup").onclick = () => { clearMsg(); ["loginCard","loginSwitch"].forEach(i => $(i).classList.add("hidden")); ["signupCard","signupSwitch"].forEach(i => $(i).classList.remove("hidden")); };
$("showLogin").onclick = () => { clearMsg(); ["signupCard","signupSwitch"].forEach(i => $(i).classList.add("hidden")); ["loginCard","loginSwitch"].forEach(i => $(i).classList.remove("hidden")); };

$("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault(); clearMsg();
  const username = $("signupUsername").value.trim().toLowerCase(), email = $("signupEmail").value.trim(), password = $("signupPassword").value, dob = $("signupDob").value;
  if (!/^[a-z0-9_]{3,20}$/.test(username)) return showMsg("Username must be 3-20 characters: letters, numbers or underscore.", "err");
  if (password.length < 8) return showMsg("Password must be at least 8 characters.", "err");
  if (!dob) return showMsg("Please enter your date of birth.", "err");
  const age = ageFromDob(dob);
  if (age < 0) return showMsg("Invalid date of birth.", "err");
  if (age < 13) return showMsg("Sorry, you must be at least 13 years old to join.", "err");
  if (!$("signupAge").checked) return showMsg("Please confirm you are 13 or older.", "err");
  const btn = $("signupBtn"); btn.disabled = true; btn.textContent = "Creating account...";
  try {
    const chk = await sb.rpc("username_available", { u: username });
    if (!chk.error && chk.data === false) throw new Error("That username is already taken.");
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username, birth_date: dob }, emailRedirectTo: window.location.origin } });
    if (error) throw error;
    if (data.user && data.user.identities && data.user.identities.length === 0) throw new Error("already registered");
    $("signupForm").reset();
    if (!data.session) { $("showLogin").click(); showMsg("Account created! Confirmation link sent to " + email + ". Open it, then log in.", "ok"); }
  } catch (err) { console.error(err); showMsg("Signup failed: " + friendlyError(err), "err"); }
  finally { btn.disabled = false; btn.textContent = "Sign up"; }
});

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault(); clearMsg();
  const btn = $("loginBtn"); btn.disabled = true; btn.textContent = "Logging in...";
  try {
    const { error } = await sb.auth.signInWithPassword({ email: $("loginEmail").value.trim(), password: $("loginPassword").value });
    if (error) throw error; $("loginForm").reset();
  } catch (err) { console.error(err); showMsg("Login failed: " + friendlyError(err), "err"); }
  finally { btn.disabled = false; btn.textContent = "Log in"; }
});

// ---------- state ----------
let me = null, myFollows = {}, stack = [], cur = { v: "home" }, token = 0;
async function loadMyFollows() {
  const { data } = await sb.from("follows").select("following_id, status").eq("follower_id", me.id);
  myFollows = {}; (data || []).forEach(f => myFollows[f.following_id] = f.status);
}

// ---------- navigation ----------
const SIDE_NAV = [["home","Home"],["search","Search"],["reels","Reels"],["chat","Messages"],["heart","Notifications"],["plus","Create"],["user","Profile"]];
const BOTTOM_NAV = ["home","search","plus","reels","user"];
function navClick(id) {
  if (id === "plus") return $("composer").classList.remove("hidden");
  if (id === "reels") return soon("Reels");
  if (id === "chat") return soon("Private chat");
  stack = [];
  if (id === "home") go("home"); else if (id === "search") go("search"); else if (id === "heart") go("notifs"); else if (id === "user") go("profile", me.id);
}
function buildNav() {
  const side = $("side"); side.innerHTML = "";
  const b = el("div", "brand"); b.innerHTML = '<div class="mark">S</div>School Ka Sastagram'; side.appendChild(b);
  SIDE_NAV.forEach(([id, label]) => { const btn = el("button", "sbtn"); btn.dataset.nav = id; btn.innerHTML = ico(id) + "<span>" + label + "</span>"; if (id === "heart") btn.innerHTML += '<span class="badge hidden" data-badge></span>'; btn.onclick = () => navClick(id); side.appendChild(btn); });
  const bt = $("bottom"); bt.innerHTML = "";
  BOTTOM_NAV.forEach(id => { const btn = el("button", "icon-btn"); btn.dataset.nav = id; btn.innerHTML = ico(id); btn.onclick = () => navClick(id); bt.appendChild(btn); });
  $("topBell").innerHTML = ico("heart") + '<span class="badge hidden" data-badge></span>'; $("topBell").onclick = () => navClick("heart");
  $("topChat").innerHTML = ico("chat"); $("topChat").onclick = () => navClick("chat");
}
function setActive() {
  const map = { home: "home", search: "search", notifs: "heart", profile: (cur.a === (me && me.id)) ? "user" : "" };
  const act = map[cur.v];
  document.querySelectorAll("[data-nav]").forEach(b => b.classList.toggle("active", b.dataset.nav === act));
}
function go(v, a) { cur = { v, a }; setActive(); window.scrollTo(0, 0); render(); }
function openProfile(id) { stack.push(cur); go("profile", id); }
function goBack() { const p = stack.pop(); if (p) go(p.v, p.a); else go("home"); }
function render() { const t = ++token; const box = $("view"); box.innerHTML = ""; const fn = { home: renderHome, search: renderSearch, notifs: renderNotifs, profile: renderProfile }[cur.v]; fn(box, t, cur.a); }
const stale = (t) => t !== token;

async function refreshBadge() {
  if (!me) return;
  const { count } = await sb.from("notifications").select("id", { count: "exact", head: true }).eq("user_id", me.id).eq("read", false);
  document.querySelectorAll("[data-badge]").forEach(b => { b.textContent = count > 9 ? "9+" : count; b.classList.toggle("hidden", !count); });
}

// ---------- follow button ----------
function followBtn(userId, onChange) {
  const b = el("button", "btn sm");
  const paint = () => { const s = myFollows[userId]; b.textContent = s === "accepted" ? "Following" : s === "pending" ? "Requested" : "Follow"; b.className = "btn sm" + (s ? " out" : ""); };
  paint();
  b.onclick = async () => {
    b.disabled = true;
    try {
      const s = myFollows[userId];
      if (!s) { const { data, error } = await sb.from("follows").insert({ following_id: userId }).select("status").single(); if (error) throw error; myFollows[userId] = data.status; }
      else { if (s === "accepted" && !confirm("Unfollow?")) { b.disabled = false; return; } const { error } = await sb.from("follows").delete().eq("follower_id", me.id).eq("following_id", userId); if (error) throw error; delete myFollows[userId]; }
      paint(); if (onChange) onChange();
    } catch (err) { showMsg("Follow failed: " + friendlyError(err), "err"); }
    b.disabled = false;
  };
  return b;
}

// ---------- posts (shared by feed and viewer) ----------
async function fillPosts(posts, box) {
  const ids = posts.map(p => p.id), uids = [...new Set(posts.map(p => p.user_id))];
  const [pr, lk, cm] = await Promise.all([
    sb.from("profiles").select("id, username, avatar_url").in("id", uids),
    sb.from("likes").select("post_id, user_id").in("post_id", ids),
    sb.from("comments").select("post_id").in("post_id", ids)
  ]);
  const prof = {}, lc = {}, liked = {}, cc = {};
  (pr.data || []).forEach(p => prof[p.id] = p);
  (lk.data || []).forEach(l => { lc[l.post_id] = (lc[l.post_id] || 0) + 1; if (l.user_id === me.id) liked[l.post_id] = true; });
  (cm.data || []).forEach(c => { cc[c.post_id] = (cc[c.post_id] || 0) + 1; });

  posts.forEach(p => {
    const pf = prof[p.user_id] || { username: "unknown" };
    const card = el("div", "post");
    const head = el("div", "phead"); head.appendChild(avatar(pf, 36, true));
    const meta = el("div", "grow"); const who = el("div", "who", pf.username); who.onclick = () => { $("postModal").classList.add("hidden"); openProfile(p.user_id); };
    meta.append(who, el("div", "time", timeAgo(p.created_at))); head.appendChild(meta);
    if (p.user_id === me.id) {
      const del = el("button", "link", "Delete"); del.onclick = async () => {
        if (!confirm("Delete this post?")) return;
        const { error } = await sb.from("posts").delete().eq("id", p.id);
        if (error) return showMsg("Could not delete: " + friendlyError(error), "err");
        const url = p.media_url || ""; const mk = "/object/public/posts/"; const i = url.indexOf(mk);
        if (i > -1) sb.storage.from("posts").remove([decodeURIComponent(url.slice(i + mk.length))]);
        card.remove(); $("postModal").classList.add("hidden"); showMsg("Post deleted.", "ok");
      };
      head.appendChild(del);
    }
    card.appendChild(head);

    const url = p.media_url || p.image_url;
    if (url && /^https:\/\//i.test(url)) {
      if (p.media_type === "video") { const v = el("video", "media"); v.src = url; v.controls = true; v.playsInline = true; v.preload = "metadata"; card.appendChild(v); }
      else { const img = el("img", "media"); img.src = url; img.alt = "Post"; img.loading = "lazy"; img.onerror = () => img.remove(); card.appendChild(img); }
    }
    const act = el("div", "actions");
    const likeBtn = el("button", "icon-btn" + (liked[p.id] ? " liked" : "")); likeBtn.innerHTML = ico("heart");
    const comBtn = el("button", "icon-btn"); comBtn.innerHTML = ico("comment");
    const sendBtn = el("button", "icon-btn"); sendBtn.innerHTML = ico("chat"); sendBtn.onclick = () => soon("Sharing");
    act.append(likeBtn, comBtn, sendBtn); card.appendChild(act);

    const likesEl = el("div", "likes"); let n = lc[p.id] || 0, isLiked = !!liked[p.id];
    const rl = () => { likesEl.textContent = n + (n === 1 ? " like" : " likes"); likeBtn.classList.toggle("liked", isLiked); }; rl(); card.appendChild(likesEl);
    let busy = false;
    likeBtn.onclick = async () => {
      if (busy) return; busy = true; isLiked = !isLiked; n += isLiked ? 1 : -1; rl();
      const r = isLiked ? await sb.from("likes").insert({ post_id: p.id, user_id: me.id }) : await sb.from("likes").delete().eq("post_id", p.id).eq("user_id", me.id);
      if (r.error) { isLiked = !isLiked; n += isLiked ? 1 : -1; rl(); showMsg("Like failed: " + friendlyError(r.error), "err"); }
      busy = false;
    };
    if (p.content) { const t = el("div", "ptext"); const b = el("b", null, pf.username); b.onclick = who.onclick; t.append(b, document.createTextNode(p.content)); card.appendChild(t); }
    const vc = el("button", "vc"); let cn = cc[p.id] || 0;
    const rc = () => { vc.textContent = cn ? "View all " + cn + (cn === 1 ? " comment" : " comments") : "Add a comment..."; }; rc();
    const open = () => openComments(p.id, d => { cn += d; rc(); }); vc.onclick = open; comBtn.onclick = open;
    card.appendChild(vc); box.appendChild(card);
  });
}

// ---------- HOME ----------
async function renderHome(box, t) {
  const stories = el("div", "stories"); box.appendChild(stories);
  const mine = el("div", "story"); const wrap = el("div", "wrap"); wrap.appendChild(avatar(me, 62, false)); wrap.appendChild(el("span", "plus", "+"));
  mine.append(wrap, el("div", "name", "Your story")); mine.onclick = () => soon("Stories"); stories.appendChild(mine);
  const feed = el("div"); box.appendChild(feed);
  const fids = Object.keys(myFollows).filter(k => myFollows[k] === "accepted");
  if (fids.length) {
    const { data } = await sb.from("profiles").select("id, username, avatar_url").in("id", fids).limit(20);
    if (stale(t)) return;
    (data || []).forEach(p => { const s = el("div", "story"); const w = el("div", "wrap"); w.appendChild(avatar(p, 62, true)); s.append(w, el("div", "name", p.username)); s.onclick = () => soon("Stories"); stories.appendChild(s); });
  }
  const { data: posts, error } = await sb.from("posts").select("*").order("created_at", { ascending: false }).limit(50);
  if (stale(t)) return;
  if (error) return showMsg("Could not load posts: " + error.message, "err");
  if (!posts.length) {
    const e = el("div", "empty", "Your feed is empty. Find your friends and follow them to see their posts."); const b = el("button", "btn sm", "Find friends"); b.style.marginTop = "12px"; b.onclick = () => navClick("search"); e.appendChild(b); feed.appendChild(e); return;
  }
  await fillPosts(posts, feed);
}

// ---------- SEARCH ----------
function userRow(p) {
  const r = el("div", "row"); r.appendChild(avatar(p, 46, false));
  const g = el("div", "grow"); const t1 = el("div", "t1", p.username); t1.onclick = () => openProfile(p.id);
  g.append(t1, el("div", "t2", p.full_name || "")); r.appendChild(g);
  if (p.id !== me.id) r.appendChild(followBtn(p.id)); return r;
}
async function renderSearch(box, t) {
  const sbx = el("div", "searchbox"); const inp = el("input"); inp.type = "search"; inp.placeholder = "Search people by username or name"; sbx.appendChild(inp); box.appendChild(sbx);
  const list = el("div"); box.appendChild(list); let timer;
  async function run() {
    const q = inp.value.trim().replace(/[%,()]/g, ""); list.innerHTML = "";
    let query = sb.from("profiles").select(PROFILE_COLS).neq("id", me.id).limit(25);
    if (q) query = query.or("username.ilike.%" + q + "%,full_name.ilike.%" + q + "%"); else query = query.order("created_at", { ascending: false });
    const { data, error } = await query; if (stale(t)) return;
    if (error) return showMsg("Search failed: " + error.message, "err");
    if (!q) list.appendChild(el("div", "head2", "Suggested"));
    if (!data.length) list.appendChild(el("div", "empty", "No one found."));
    data.forEach(p => list.appendChild(userRow(p)));
  }
  inp.oninput = () => { clearTimeout(timer); timer = setTimeout(run, 300); };
  run();
}

// ---------- NOTIFICATIONS ----------
async function renderNotifs(box, t) {
  box.appendChild(el("div", "head2", "Notifications"));
  const { data, error } = await sb.from("notifications").select("*").eq("user_id", me.id).order("created_at", { ascending: false }).limit(50);
  if (stale(t)) return;
  if (error) return showMsg("Could not load notifications: " + error.message, "err");
  if (!data.length) { box.appendChild(el("div", "empty", "No notifications yet.")); return; }
  const ids = [...new Set(data.map(n => n.actor_id))];
  const { data: profs } = await sb.from("profiles").select("id, username, avatar_url").in("id", ids);
  const pm = {}; (profs || []).forEach(p => pm[p.id] = p);
  data.forEach(n => {
    const a = pm[n.actor_id] || { username: "someone" };
    const r = el("div", "row" + (n.read ? "" : " unread")); r.appendChild(avatar(a, 46, false));
    const g = el("div", "grow"); const t1 = el("div", "t1", a.username); t1.onclick = () => openProfile(n.actor_id);
    const txt = { follow_request: "wants to follow you.", follow: "started following you.", follow_accepted: "accepted your follow request.", like: "liked your post.", comment: "commented on your post." }[n.type];
    g.append(t1, el("div", "t2", txt + " " + timeAgo(n.created_at))); r.appendChild(g);
    const acts = el("div", "acts");
    if (n.type === "follow_request") {
      const ok = el("button", "btn sm", "Accept"), no = el("button", "btn sm out", "Decline");
      ok.onclick = async () => { const { error } = await sb.from("follows").update({ status: "accepted" }).eq("follower_id", n.actor_id).eq("following_id", me.id); if (error) return showMsg("Failed: " + friendlyError(error), "err"); await sb.from("notifications").delete().eq("id", n.id); showMsg("Request accepted.", "ok"); r.remove(); };
      no.onclick = async () => { const { error } = await sb.from("follows").delete().eq("follower_id", n.actor_id).eq("following_id", me.id); if (error) return showMsg("Failed: " + friendlyError(error), "err"); r.remove(); };
      acts.append(ok, no);
    } else if (n.type === "follow" && !myFollows[n.actor_id]) acts.appendChild(followBtn(n.actor_id));
    r.appendChild(acts); box.appendChild(r);
  });
  await sb.from("notifications").update({ read: true }).eq("user_id", me.id).eq("read", false);
  refreshBadge();
}

// ---------- PROFILE ----------
async function renderProfile(box, t, uid) {
  const [pr, st] = await Promise.all([
    sb.from("profiles").select(PROFILE_COLS).eq("id", uid).maybeSingle(),
    sb.rpc("profile_stats", { uid })
  ]);
  if (stale(t)) return;
  const p = pr.data;
  if (!p) { box.appendChild(el("div", "empty", "Profile not found.")); return; }
  if (uid === me.id) me = Object.assign(me, p);
  const s = (st.data && st.data[0]) || { posts: 0, followers: 0, following: 0 };
  const isMe = uid === me.id;
  if (!isMe) { const back = el("div", "head2"); const bb = el("button", "icon-btn", "←"); bb.onclick = goBack; back.append(bb, document.createTextNode(p.username)); box.appendChild(back); }

  const pro = el("div", "pro"); const top = el("div", "top"); top.appendChild(avatar(p, 84, true));
  const stats = el("div", "stats");
  [["Posts", s.posts], ["Followers", s.followers], ["Following", s.following]].forEach(([l, v]) => { const d = el("div", "stat"); d.append(el("b", null, String(v)), el("span", null, l)); stats.appendChild(d); });
  top.appendChild(stats); pro.appendChild(top);
  if (isMe) pro.appendChild(el("div", "nm", p.username)); 
  if (p.full_name) pro.appendChild(el("div", "nm", p.full_name));
  if (p.bio) pro.appendChild(el("div", "bio", p.bio));
  const btns = el("div", "btns");
  if (isMe) {
    const e = el("button", "btn out", "Edit profile"); e.onclick = openEdit;
    const lo = el("button", "btn out", "Log out"); lo.onclick = async () => { await sb.auth.signOut(); showMsg("You have been logged out.", "ok"); };
    btns.append(e, lo);
  } else {
    const fb = followBtn(uid, () => render()); fb.classList.remove("sm"); btns.appendChild(fb);
    const mb = el("button", "btn out", "Message"); mb.onclick = () => soon("Private chat"); btns.appendChild(mb);
  }
  pro.appendChild(btns); box.appendChild(pro);

  const canView = isMe || !p.is_private || myFollows[uid] === "accepted";
  if (!canView) { box.appendChild(el("div", "private-note", "🔒 This account is private. Follow to see their posts.")); return; }
  const { data: posts } = await sb.from("posts").select("*").eq("user_id", uid).order("created_at", { ascending: false }).limit(60);
  if (stale(t)) return;
  if (!posts || !posts.length) { box.appendChild(el("div", "private-note", isMe ? "No posts yet. Tap + to share your first one." : "No posts yet.")); return; }
  const grid = el("div", "grid");
  posts.forEach(po => {
    const tile = el("div", "tile"); const url = po.media_url || po.image_url;
    if (url && po.media_type === "video") { const v = el("video"); v.src = url + "#t=0.1"; v.muted = true; v.preload = "metadata"; v.playsInline = true; tile.appendChild(v); const pl = el("span", "pl"); pl.innerHTML = ico("play"); tile.appendChild(pl); }
    else if (url) { const i = el("img"); i.src = url; i.loading = "lazy"; i.alt = ""; tile.appendChild(i); }
    else tile.appendChild(el("div", "tx", po.content || ""));
    tile.onclick = async () => { const body = $("postModalBody"); body.innerHTML = ""; $("postModal").classList.remove("hidden"); await fillPosts([po], body); };
    grid.appendChild(tile);
  });
  box.appendChild(grid);
}
$("postModalClose").onclick = () => { $("postModal").classList.add("hidden"); $("postModalBody").innerHTML = ""; };

// ---------- EDIT PROFILE ----------
let newAvatarUrl = null;
function paintEditAv() { const h = $("editAv"); h.innerHTML = ""; h.appendChild(avatar({ username: me.username, avatar_url: newAvatarUrl || me.avatar_url }, 64, false)); }
function openEdit() { newAvatarUrl = null; $("editName").value = me.full_name || ""; $("editBio").value = me.bio || ""; $("editPrivate").checked = !!me.is_private; paintEditAv(); $("editSheet").classList.remove("hidden"); }
$("editCancel").onclick = () => $("editSheet").classList.add("hidden");
function compressImage(file, max, square) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let sx = 0, sy = 0, sw = img.width, sh = img.height;
      if (square) { const m = Math.min(sw, sh); sx = (sw - m) / 2; sy = (sh - m) / 2; sw = sh = m; }
      const s = Math.min(1, max / Math.max(sw, sh)), w = Math.round(sw * s), h = Math.round(sh * s);
      const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, w, h); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("Could not process image")), "image/jpeg", 0.85);
    };
    img.onerror = () => rej(new Error("Could not read this image. Try a JPG or PNG.")); img.src = url;
  });
}
$("avFile").addEventListener("change", async () => {
  const f = $("avFile").files[0]; if (!f) return;
  if (!f.type.startsWith("image/")) return showMsg("Please choose a photo.", "err");
  try {
    showMsg("Uploading photo...", "ok");
    const blob = await compressImage(f, 400, true), path = me.id + "/" + Date.now() + ".jpg";
    const up = await sb.storage.from("avatars").upload(path, blob, { contentType: "image/jpeg" });
    if (up.error) throw up.error;
    newAvatarUrl = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl; paintEditAv(); showMsg("Photo ready. Tap Save.", "ok");
  } catch (err) { showMsg("Photo failed: " + friendlyError(err), "err"); }
});
$("editSave").onclick = async () => {
  const btn = $("editSave"); btn.disabled = true;
  const upd = { full_name: $("editName").value.trim() || null, bio: $("editBio").value.trim() || null, is_private: $("editPrivate").checked };
  if (newAvatarUrl) upd.avatar_url = newAvatarUrl;
  const { data, error } = await sb.from("profiles").update(upd).eq("id", me.id).select(PROFILE_COLS).single();
  btn.disabled = false;
  if (error) return showMsg("Could not save: " + friendlyError(error), "err");
  me = Object.assign(me, data); $("editSheet").classList.add("hidden"); showMsg("Profile saved.", "ok"); render();
};

// ---------- COMMENTS ----------
let cPost = null, cCb = null;
async function loadComments() {
  const list = $("cList"); list.innerHTML = "";
  const { data, error } = await sb.from("comments").select("*").eq("post_id", cPost).order("created_at", { ascending: true }).limit(100);
  if (error) { list.appendChild(el("div", "c", "Could not load comments: " + error.message)); return; }
  if (!data.length) { list.appendChild(el("div", "c", "No comments yet. Be the first!")); return; }
  const ids = [...new Set(data.map(c => c.user_id))];
  const { data: profs } = await sb.from("profiles").select("id, username").in("id", ids);
  const nm = {}; (profs || []).forEach(p => nm[p.id] = p.username);
  data.forEach(c => { const row = el("div", "c"); row.append(el("b", null, nm[c.user_id] || "unknown"), document.createTextNode(c.content), el("small", null, timeAgo(c.created_at))); list.appendChild(row); });
  list.scrollTop = list.scrollHeight;
}
function openComments(id, cb) { cPost = id; cCb = cb; $("cSheet").classList.remove("hidden"); loadComments(); }
$("cClose").onclick = () => $("cSheet").classList.add("hidden");
$("cForm").addEventListener("submit", async (e) => {
  e.preventDefault(); const text = $("cText").value.trim(); if (!text) return;
  const { error } = await sb.from("comments").insert({ post_id: cPost, user_id: me.id, content: text });
  if (error) return showMsg("Comment failed: " + friendlyError(error), "err");
  $("cText").value = ""; if (cCb) cCb(1); loadComments();
});

// ---------- NEW POST ----------
let pickedFile = null;
function resetComposer() { pickedFile = null; $("postForm").reset(); $("preview").innerHTML = ""; }
$("postCancel").onclick = () => { $("composer").classList.add("hidden"); resetComposer(); };
$("fileInput").addEventListener("change", () => {
  const f = $("fileInput").files[0]; $("preview").innerHTML = ""; pickedFile = null; if (!f) return;
  const isImg = f.type.startsWith("image/"), isVid = f.type.startsWith("video/");
  if (!isImg && !isVid) { showMsg("Please choose a photo or a video.", "err"); $("fileInput").value = ""; return; }
  if (isImg && f.size > 10 * 1024 * 1024) { showMsg("Photo is too big (max 10 MB).", "err"); $("fileInput").value = ""; return; }
  if (isVid && f.size > 25 * 1024 * 1024) { showMsg("Video is too big (max 25 MB). Choose a shorter video.", "err"); $("fileInput").value = ""; return; }
  pickedFile = f; const m = isImg ? el("img") : el("video"); m.src = URL.createObjectURL(f); if (isVid) { m.controls = true; m.playsInline = true; } $("preview").appendChild(m);
});
$("postForm").addEventListener("submit", async (e) => {
  e.preventDefault(); clearMsg();
  const content = $("postText").value.trim();
  if (!pickedFile && !content) return showMsg("Choose a photo/video or write a caption.", "err");
  const btn = $("postBtn"); btn.disabled = true; btn.textContent = "Uploading...";
  try {
    let media_url = null, media_type = null;
    if (pickedFile) {
      let body, type, ext;
      if (pickedFile.type.startsWith("image/")) { body = await compressImage(pickedFile, 1280, false); type = "image/jpeg"; ext = "jpg"; media_type = "image"; }
      else { body = pickedFile; type = pickedFile.type; ext = (type.split("/")[1] || "mp4").replace("quicktime", "mov"); media_type = "video"; }
      const path = me.id + "/" + Date.now() + "." + ext;
      const up = await sb.storage.from("posts").upload(path, body, { contentType: type, upsert: false });
      if (up.error) throw up.error;
      media_url = sb.storage.from("posts").getPublicUrl(path).data.publicUrl;
    }
    const { error } = await sb.from("posts").insert({ user_id: me.id, content: content || null, media_url, media_type });
    if (error) throw error;
    $("composer").classList.add("hidden"); resetComposer(); showMsg("Posted!", "ok"); stack = []; go("home");
  } catch (err) { console.error(err); showMsg("Could not post: " + friendlyError(err), "err"); }
  finally { btn.disabled = false; btn.textContent = "Share"; }
});

// ---------- SESSION ----------
let badgeTimer;
async function onSession(session) {
  clearInterval(badgeTimer);
  if (!session) { me = null; $("authView").classList.remove("hidden"); $("appView").classList.add("hidden"); return; }
  try {
    const { data, error } = await sb.from("profiles").select(PROFILE_COLS).eq("id", session.user.id).maybeSingle();
    if (error) throw error;
    if (!data) throw new Error("Your profile was not found. Please contact the admin.");
    me = data; await loadMyFollows();
    $("authView").classList.add("hidden"); $("appView").classList.remove("hidden");
    buildNav(); stack = []; go("home"); refreshBadge(); badgeTimer = setInterval(refreshBadge, 60000);
  } catch (err) { console.error(err); showMsg("Login problem: " + friendlyError(err), "err"); }
}
if (sb) sb.auth.onAuthStateChange((ev, session) => setTimeout(() => onSession(session), 0));
