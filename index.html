<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Ka Sastagram</title>
<style>
  :root { --bg:#fafafa; --card:#fff; --line:#dbdbdb; --text:#262626; --muted:#737373; --accent:#e1306c; --ok:#1a7f37; --err:#c62828; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:480px; margin:0 auto; padding:16px; }
  h1 { font-family:"Brush Script MT","Segoe Script",cursive; font-size:2rem; text-align:center; margin:12px 0 4px; color:var(--accent); }
  .tag { text-align:center; color:var(--muted); font-size:.9rem; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  input, textarea, button { width:100%; font:inherit; padding:12px; margin-top:8px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--text); }
  textarea { resize:vertical; min-height:80px; }
  button { background:var(--accent); color:#fff; border:0; font-weight:600; cursor:pointer; }
  button.link { background:none; color:var(--accent); width:auto; padding:6px; margin:0; font-weight:600; }
  button:disabled { opacity:.6; }
  label.chk { display:flex; gap:8px; align-items:flex-start; margin-top:12px; font-size:.85rem; color:var(--muted); }
  label.chk input { width:auto; margin:3px 0 0; }
  label.small { display:block; margin-top:10px; font-size:.8rem; color:var(--muted); }
  #msg { padding:10px 12px; border-radius:8px; margin-bottom:12px; font-size:.9rem; display:none; }
  #msg.ok { display:block; background:#e6f4ea; color:var(--ok); }
  #msg.err { display:block; background:#fdecea; color:var(--err); }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .topbar button { width:auto; padding:8px 14px; margin:0; background:#fff; color:var(--text); border:1px solid var(--line); }
  .post .who { font-weight:700; }
  .post .time { color:var(--muted); font-size:.75rem; }
  .post p { white-space:pre-wrap; word-wrap:break-word; margin:8px 0; }
  .post img { width:100%; border-radius:8px; margin-top:6px; }
  .hidden { display:none; }
  .center { text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>School Ka Sastagram</h1>
  <div class="tag">Connect with your school friends</div>
  <div id="msg"></div>

  <!-- AUTH -->
  <div id="authView">
    <div class="card" id="loginCard">
      <h3 style="margin:0">Log in</h3>
      <form id="loginForm">
        <input id="loginEmail" type="email" placeholder="Email" autocomplete="email" required>
        <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" id="loginBtn">Log in</button>
      </form>
      <div class="center" style="margin-top:10px">No account? <button class="link" id="showSignup">Sign up</button></div>
    </div>

    <div class="card hidden" id="signupCard">
      <h3 style="margin:0">Create account</h3>
      <form id="signupForm">
        <input id="signupUsername" type="text" placeholder="Username (3-20 letters, numbers, _)" autocomplete="username" required>
        <input id="signupEmail" type="email" placeholder="Email" autocomplete="email" required>
        <input id="signupPassword" type="password" placeholder="Password (min 8 characters)" autocomplete="new-password" required>
        <label class="small" for="signupDob">Date of birth</label>
        <input id="signupDob" type="date" required>
        <label class="chk"><input id="signupAge" type="checkbox"> I confirm I am 13 years or older.</label>
        <button type="submit" id="signupBtn">Sign up</button>
      </form>
      <div class="center" style="margin-top:10px">Already have an account? <button class="link" id="showLogin">Log in</button></div>
    </div>
  </div>

  <!-- APP -->
  <div id="appView" class="hidden">
    <div class="topbar">
      <div>Hi, <b id="meName"></b></div>
      <button id="logoutBtn">Log out</button>
    </div>
    <div class="card">
      <form id="postForm">
        <textarea id="postText" placeholder="What's on your mind?" maxlength="500"></textarea>
        <input id="postImage" type="url" placeholder="Image link (optional, https://...)">
        <button type="submit" id="postBtn">Post</button>
      </form>
    </div>
    <div id="feed"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== CONFIGURATION: paste your PUBLISHABLE key below. NEVER use the secret/service_role key. ======
const SUPABASE_URL = "https://rxnzqrycdftmozwcvqyr.supabase.co";
const SUPABASE_ANON_KEY = "MY_SUPABASE_PUBLISHABLE_KEY";
// =====================================================================================================

const $ = (id) => document.getElementById(id);
const msgBox = $("msg");
function showMsg(text, type) {
  msgBox.textContent = text;
  msgBox.className = type;
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function clearMsg() { msgBox.className = ""; msgBox.textContent = ""; }

let sb = null;
if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === "MY_SUPABASE_PUBLISHABLE_KEY") {
  showMsg("Setup incomplete: the Supabase publishable key has not been added to index.html yet.", "err");
} else if (!window.supabase) {
  showMsg("Could not load Supabase library. Check your internet and refresh.", "err");
} else {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

function friendlyError(err) {
  const m = (err && err.message) || String(err);
  if (/Invalid login credentials/i.test(m)) return "Wrong email or password.";
  if (/Email not confirmed/i.test(m)) return "Please confirm your email first. Check your inbox (and spam).";
  if (/already registered/i.test(m)) return "This email already has an account. Try logging in.";
  if (/rate limit/i.test(m)) return "Too many attempts. Please wait a few minutes and try again.";
  if (/duplicate key|unique/i.test(m)) return "That username is already taken. Choose another.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Network problem. Check your internet and try again.";
  return m;
}

function ageFromDob(dobStr) {
  const dob = new Date(dobStr + "T00:00:00");
  if (isNaN(dob)) return -1;
  const now = new Date();
  let age = now.getFullYear() - dob.getFullYear();
  const md = now.getMonth() - dob.getMonth();
  if (md < 0 || (md === 0 && now.getDate() < dob.getDate())) age--;
  return age;
}

// ---- view switching ----
function showAuth() { $("authView").classList.remove("hidden"); $("appView").classList.add("hidden"); }
function showApp() { $("authView").classList.add("hidden"); $("appView").classList.remove("hidden"); }
$("showSignup").onclick = () => { clearMsg(); $("loginCard").classList.add("hidden"); $("signupCard").classList.remove("hidden"); };
$("showLogin").onclick = () => { clearMsg(); $("signupCard").classList.add("hidden"); $("loginCard").classList.remove("hidden"); };

// ---- SIGNUP ----
$("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearMsg();
  if (!sb) return showMsg("Setup incomplete: add the publishable key first.", "err");

  const username = $("signupUsername").value.trim().toLowerCase();
  const email = $("signupEmail").value.trim();
  const password = $("signupPassword").value;
  const dob = $("signupDob").value;

  if (!/^[a-z0-9_]{3,20}$/.test(username)) return showMsg("Username must be 3-20 characters: letters, numbers or underscore.", "err");
  if (password.length < 8) return showMsg("Password must be at least 8 characters.", "err");
  if (!dob) return showMsg("Please enter your date of birth.", "err");
  const age = ageFromDob(dob);
  if (age < 0) return showMsg("Invalid date of birth.", "err");
  if (age < 13) return showMsg("Sorry, you must be at least 13 years old to join.", "err");
  if (!$("signupAge").checked) return showMsg("Please confirm you are 13 or older.", "err");

  const btn = $("signupBtn");
  btn.disabled = true; btn.textContent = "Creating account...";
  try {
    const { data, error } = await sb.auth.signUp({
      email, password,
      options: { data: { username, birth_date: dob }, emailRedirectTo: window.location.origin }
    });
    if (error) throw error;

    // Supabase returns a user with empty identities if the email is already registered
    if (data.user && data.user.identities && data.user.identities.length === 0) {
      throw new Error("already registered");
    }

    if (data.session) {
      await ensureProfile(data.user, username);
      showMsg("Account created! Welcome to School Ka Sastagram.", "ok");
      $("signupForm").reset();
    } else {
      showMsg("Account created! We sent a confirmation link to " + email + ". Open it, then log in here.", "ok");
      $("signupForm").reset();
      $("showLogin").click();
      showMsg("Account created! We sent a confirmation link to " + email + ". Open it, then log in here.", "ok");
    }
  } catch (err) {
    console.error(err);
    showMsg("Signup failed: " + friendlyError(err), "err");
  } finally {
    btn.disabled = false; btn.textContent = "Sign up";
  }
});

// ---- LOGIN ----
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearMsg();
  if (!sb) return showMsg("Setup incomplete: add the publishable key first.", "err");
  const btn = $("loginBtn");
  btn.disabled = true; btn.textContent = "Logging in...";
  try {
    const { error } = await sb.auth.signInWithPassword({
      email: $("loginEmail").value.trim(),
      password: $("loginPassword").value
    });
    if (error) throw error;
    $("loginForm").reset();
  } catch (err) {
    console.error(err);
    showMsg("Login failed: " + friendlyError(err), "err");
  } finally {
    btn.disabled = false; btn.textContent = "Log in";
  }
});

// ---- LOGOUT ----
$("logoutBtn").onclick = async () => {
  if (!sb) return;
  await sb.auth.signOut();
  showMsg("You have been logged out.", "ok");
};

// ---- PROFILE ----
let me = null; // { id, username }
async function ensureProfile(user, fallbackName) {
  const { data: existing, error: selErr } = await sb.from("profiles").select("id, username").eq("id", user.id).maybeSingle();
  if (selErr) throw selErr;
  if (existing) return existing;
  const username = ((user.user_metadata && user.user_metadata.username) || fallbackName || "user" + user.id.slice(0, 6)).toLowerCase();
  const { data, error } = await sb.from("profiles").insert({ id: user.id, username }).select("id, username").single();
  if (error) throw error;
  return data;
}

// ---- POSTS ----
function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " hr ago";
  return new Date(iso).toLocaleDateString();
}

async function loadFeed() {
  const feed = $("feed");
  const { data: posts, error } = await sb.from("posts").select("*").order("created_at", { ascending: false }).limit(50);
  if (error) {
    console.error(error);
    feed.innerHTML = "";
    return showMsg("Could not load posts: " + error.message, "err");
  }
  feed.innerHTML = "";
  if (!posts.length) {
    const d = document.createElement("div");
    d.className = "card center"; d.style.color = "var(--muted)";
    d.textContent = "No posts yet. Be the first to post!";
    feed.appendChild(d);
    return;
  }
  const ids = [...new Set(posts.map(p => p.user_id))];
  const names = {};
  const { data: profs } = await sb.from("profiles").select("id, username").in("id", ids);
  (profs || []).forEach(p => names[p.id] = p.username);

  posts.forEach(p => {
    const card = document.createElement("div");
    card.className = "card post";
    const who = document.createElement("div");
    who.className = "who"; who.textContent = names[p.user_id] || "unknown";
    const time = document.createElement("div");
    time.className = "time"; time.textContent = timeAgo(p.created_at);
    const body = document.createElement("p");
    body.textContent = p.content || "";
    card.append(who, time, body);
    if (p.image_url && /^https:\/\//i.test(p.image_url)) {
      const img = document.createElement("img");
      img.src = p.image_url; img.alt = "Post image"; img.loading = "lazy";
      img.onerror = () => img.remove();
      card.appendChild(img);
    }
    feed.appendChild(card);
  });
}

$("postForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearMsg();
  const content = $("postText").value.trim();
  const image = $("postImage").value.trim();
  if (!content && !image) return showMsg("Write something or add an image link.", "err");
  if (image && !/^https:\/\//i.test(image)) return showMsg("Image link must start with https://", "err");
  const btn = $("postBtn");
  btn.disabled = true; btn.textContent = "Posting...";
  try {
    const { error } = await sb.from("posts").insert({ user_id: me.id, content, image_url: image || null });
    if (error) throw error;
    $("postForm").reset();
    showMsg("Posted!", "ok");
    await loadFeed();
  } catch (err) {
    console.error(err);
    showMsg("Could not post: " + friendlyError(err), "err");
  } finally {
    btn.disabled = false; btn.textContent = "Post";
  }
});

// ---- SESSION HANDLING ----
async function onSession(session) {
  if (!session) { me = null; showAuth(); return; }
  try {
    me = await ensureProfile(session.user);
    $("meName").textContent = me.username;
    showApp();
    await loadFeed();
  } catch (err) {
    console.error(err);
    showApp();
    $("meName").textContent = "friend";
    showMsg("Logged in, but profile problem: " + friendlyError(err), "err");
  }
}

if (sb) {
  sb.auth.onAuthStateChange((event, session) => {
    // defer to avoid deadlocks inside the auth callback
    setTimeout(() => onSession(session), 0);
  });
}
</script>
</body>
</html>
